<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工坊 - DevKit 开发者工具箱</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <script>
    // 立即应用持久化皮肤，防止闪烁
    (function() {
      const savedSkin = localStorage.getItem('devkit-skin');
      if (savedSkin && savedSkin !== 'default') {
        document.body.classList.add('skin-' + savedSkin);
      }
    })();
  </script>
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-toggle" id="sidebar-toggle" type="button"
            title="收起侧栏" aria-label="收起侧栏" data-label-open="收起侧栏" data-label-close="展开侧栏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <div class="logo-container">
      <img src="assets/icons/icon.png" alt="DevKit" class="logo-icon">
      <span class="logo-text">工坊</span>
    </div>
    
    <nav>
      <div class="nav-item active" data-page="json-tool">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8.5 3.5h-1A2.5 2.5 0 0 0 5 6v3.2a2.8 2.8 0 0 1-2.8 2.8 2.8 2.8 0 0 1 2.8 2.8V18a2.5 2.5 0 0 0 2.5 2.5h1"/>
            <path d="M15.5 3.5h1A2.5 2.5 0 0 1 19 6v3.2a2.8 2.8 0 0 0 2.8 2.8 2.8 2.8 0 0 0-2.8 2.8V18a2.5 2.5 0 0 1-2.5 2.5h-1"/>
          </svg>
        </span>
        <span>JSON 格式化</span>
      </div>

      <div class="nav-item" data-page="json-diff-tool">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="18" r="3"/>
            <circle cx="6" cy="6" r="3"/>
            <path d="M13 6h3a2 2 0 0 1 2 2v7"/>
            <path d="M11 18H8a2 2 0 0 1-2-2V9"/>
            <path d="M15 3l3 3-3 3"/>
            <path d="M9 15l-3 3 3 3"/>
          </svg>
        </span>
        <span>JSON 对比</span>
      </div>

      <div class="nav-item" data-page="text-diff-tool">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="7.5" height="16" rx="1.5"/>
            <rect x="13.5" y="4" width="7.5" height="16" rx="1.5"/>
            <path d="M5 12h3.5"/>
            <path d="M15.75 9.75v4.5"/>
            <path d="M13.5 12h4.5"/>
          </svg>
        </span>
        <span>文本对比</span>
      </div>

      <div class="nav-item" data-page="password-tool">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="3"/>
            <circle cx="9" cy="9" r="1.2" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
            <circle cx="15" cy="15" r="1.2" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span>随机密码</span>
      </div>

      <div class="nav-item" data-page="crypto-tool">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="11" rx="2"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            <circle cx="12" cy="15" r="1.3" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span>加解密工具</span>
      </div>

      <div class="nav-item" data-page="table-tool">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M3 10h18"/>
            <path d="M3 15h18"/>
            <path d="M9 4v16"/>
          </svg>
        </span>
        <span>表格转换</span>
      </div>
      
      <div class="nav-item" data-page="timestamp-tool">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M12 7v5l4 2"/>
          </svg>
        </span>
        <span>时间戳转换</span>
      </div>

      <div class="nav-item" data-page="jwt-tool">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="7.5" cy="16.5" r="4"/>
            <path d="M10.3 13.7 20 4"/>
            <path d="M15.5 8.5l2.5 2.5"/>
          </svg>
        </span>
        <span>JWT 解析</span>
      </div>

      <div class="nav-item" data-page="regex-tool">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="5.5" cy="17.5" r="1.4" fill="currentColor" stroke="none"/>
            <path d="M14.5 7.5v10"/>
            <path d="M10.2 10l8.6 5"/>
            <path d="M18.8 10l-8.6 5"/>
          </svg>
        </span>
        <span>正则测试</span>
      </div>

      <div class="nav-item" data-page="numeric-tool">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2"/>
            <rect x="7" y="5" width="10" height="3" rx="1"/>
            <path d="M8.5 12.5h.01M12 12.5h.01M15.5 12.5h.01M8.5 16.5h.01M12 16.5h.01M15.5 16.5h.01" stroke-width="2.5"/>
          </svg>
        </span>
        <span>数字工具</span>
      </div>

      <div class="nav-item" data-page="frontend-tool">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
          </svg>
        </span>
        <span>前端小工具</span>
      </div>

      <div class="nav-item" data-page="cron-tool">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="16" rx="2"/>
            <path d="M8 3v4M16 3v4M3 11h18"/>
            <path d="M8 15.5h.01M12 15.5h.01M16 15.5h.01" stroke-width="2.5"/>
          </svg>
        </span>
        <span>Cron 解析</span>
      </div>

      <div class="nav-item" data-page="markdown-pdf-tool">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 17.5V7l4.5 5.5L11 7v10.5"/>
            <path d="M19 7v10.5"/>
            <path d="M16 14.5l3 3 3-3"/>
          </svg>
        </span>
        <span>MD 转 PDF</span>
      </div>
    </nav>
  </aside>

  <main class="main-content">
    <header class="top-bar">
      <div class="page-title" id="page-title">数据加载中...</div>
      <div class="top-actions"></div>
    </header>

    <div id="app-container" style="flex-grow: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
      <!-- 这里将动态加载各个模块的 view.html -->
      <div id="active-tool-content" class="tool-page active">
         <div class="empty-state">正在初始化模块...</div>
      </div>
    </div>
  </main>

  <script src="src/renderer.js"></script>
</body>
</html>
