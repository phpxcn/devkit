<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工坊 - DevKit 开发者工具箱</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <script>
    // 立即应用持久化皮肤，防止闪烁
    (function() {
      const savedSkin = localStorage.getItem('devkit-skin');
      if (savedSkin && savedSkin !== 'default') {
        document.body.classList.add('skin-' + savedSkin);
      }
    })();
  </script>
  <aside class="sidebar">
    <div class="logo-container">
      <img src="assets/icons/icon.png" alt="DevKit" class="logo-icon">
      <span class="logo-text">工坊</span>
    </div>
    
    <nav>
      <div class="nav-item active" data-page="json-tool">
        <span class="nav-icon">{ }</span>
        <span>JSON 格式化</span>
      </div>

      <div class="nav-item" data-page="json-diff-tool">
        <span class="nav-icon">↹</span>
        <span>JSON 对比</span>
      </div>

      <div class="nav-item" data-page="text-diff-tool">
        <span class="nav-icon">≡</span>
        <span>文本对比</span>
      </div>

      <div class="nav-item" data-page="password-tool">
        <span class="nav-icon">🔒</span>
        <span>随机密码</span>
      </div>
      
      <div class="nav-item" data-page="table-tool">
        <span class="nav-icon">田</span>
        <span>表格转换</span>
      </div>
      
      <div class="nav-item" data-page="timestamp-tool">
        <span class="nav-icon">🕒</span>
        <span>时间戳转换</span>
      </div>
    </nav>
  </aside>

  <main class="main-content">
    <header class="top-bar">
      <div class="page-title" id="page-title">数据加载中...</div>
      <div class="top-actions"></div>
    </header>

    <div id="app-container" style="flex-grow: 1; display: flex; flex-direction: column;">
      <!-- 这里将动态加载各个模块的 view.html -->
      <div id="active-tool-content" class="tool-page active">
         <div class="empty-state">正在初始化模块...</div>
      </div>
    </div>
  </main>

  <script src="src/renderer.js"></script>
</body>
</html>
