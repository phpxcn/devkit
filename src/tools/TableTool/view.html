<div class="table-tool-scroll-wrapper" style="overflow-y: auto; height: calc(100vh - 140px); padding-right: 10px; padding-bottom: 20px; display: flex; flex-direction: column; gap: 12px;">
  <!-- 模块 1：数据源 (Source Data) -->
  <div class="tool-card" style="margin-bottom: 0px;">
     <div class="card-header-fused" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;">
       <div class="header-left" style="display: flex; align-items: center; gap: 12px;">
         <div class="header-title" style="margin: 0; font-size: 1.05rem; white-space: nowrap; flex-shrink: 0;"><i class="icon-source" style="margin-right: 4px;"></i> 数据源</div>
         <select id="source-data-format" class="f-select-modern" style="padding: 4px 24px 4px 12px; height: 32px; font-size: 0.9rem; border: none; font-weight: bold; background: rgba(255,255,255,0.05); border-radius: 6px; cursor: pointer; color: var(--accent-color);">
            <option value="json">JSON 数组</option>
            <option value="xlsx">Excel</option>
            <option value="csv">CSV</option>
            <option value="md">Markdown 表格</option>
            <option value="html">HTML 表格</option>
            <option value="sql">插入 SQL</option>
            <option value="latex">LaTeX 表格</option>
            <option value="xml">XML</option>
            <option value="yaml">YAML</option>
         </select>
       </div>
       <div class="header-actions" style="display: flex; gap: 8px;">
          <button class="btn btn-primary btn-sm" id="btn-demo-data"><i class="icon">✨</i> 示例</button>
          <button class="btn btn-secondary btn-sm" id="btn-import-f">上传文件</button>
       </div>
     </div>
     <div class="card-body-fused" style="padding: 16px;">
        <textarea id="source-input-editor" class="f-textarea" placeholder="在此粘贴需要处理的源数据..." style="width: 100%; min-height: 220px; outline: none;"></textarea>
     </div>
  </div>

  <!-- 模块 2：在线表格编辑器 -->
  <div class="tool-card" style="margin-bottom: 0px;">
     <div class="card-header-fused" style="padding: 12px 16px;">
       <div class="header-title"><i class="icon-table" style="margin-right: 4px;"></i> 在线表格编辑器 <span id="table-stats" class="stats-badge" style="margin-left: 8px; font-weight: normal;">0 x 0</span></div>
     </div>
     <div class="card-body-fused grid-layout">
       <div class="action-sidebar">
         <div class="action-grid" style="grid-template-columns: repeat(3, 1fr); gap: 6px;">
           <button class="grid-btn" id="btn-undo-f" title="撤销"><i class="icon">↶</i><span>撤销</span></button>
           <button class="grid-btn" id="btn-redo-f" title="重做"><i class="icon">↷</i><span>重做</span></button>
           <button class="grid-btn" id="btn-transpose-f" title="转置"><i class="icon">⇄</i><span>转置</span></button>

           <button class="grid-btn" id="btn-clear-f" title="清空" style="color: var(--danger);"><i class="icon" style="color: var(--danger);">🗑</i><span style="color: var(--danger);">清空</span></button>
           <button class="grid-btn" id="btn-rm-blank-rows" title="删除空行"><i class="icon">✂</i><span>删除空行</span></button>
           <button class="grid-btn" id="btn-remove-dup-f" title="去重"><i class="icon">≡</i><span>去重</span></button>

           <button class="grid-btn" id="btn-upper-f" title="转大写"><i class="icon" style="color: var(--accent-color);">Ａ</i><span>转大写</span></button>
           <button class="grid-btn" id="btn-lower-f" title="转小写"><i class="icon" style="color: var(--accent-color);">ａ</i><span>转小写</span></button>
           <button class="grid-btn" id="btn-capitalize-f" title="首字母大写"><i class="icon" style="color: var(--accent-color);">Ｔ</i><span>首字母大写</span></button>
         </div>
         <div class="search-replace-f" style="margin-top: 16px;">
            <input type="text" id="search-input" placeholder="查找替换 (支持正则)" class="f-input" style="font-size: 0.8rem; margin-bottom: 6px; width: 100%;">
            <input type="text" id="replace-input" placeholder="替换为..." class="f-input" style="font-size: 0.8rem; width: 100%;">
            <button class="btn btn-secondary w-100" id="btn-replace-all" style="margin-top: 10px;">全部替换</button>
         </div>
       </div>
       <div class="grid-preview-container" style="position: relative;">
          <div id="table-grid-view" class="table-scroll-area" style="display: block;">
            <!-- 动态网格将渲染于此 -->
            <div class="empty-state">等待上方数据源接入</div>
          </div>
       </div>
     </div>
  </div>

  <!-- 下卡片：表格生成器 -->
  <div class="tool-card">
    <div class="card-header-fused">
      <div class="header-title"><i class="icon-gen"></i> 表格生成器</div>
      <div class="header-actions">
        <button class="btn btn-secondary btn-sm" id="btn-copy-table">复制到剪贴板</button>
        <button class="btn btn-primary btn-sm" id="btn-export-f">下载文件</button>
      </div>
    </div>
    <div class="format-tabs" id="table-format-tabs">
      <div class="tab-item active" data-format="csv">CSV</div>
      <div class="tab-item" data-format="json">JSON</div>
      <div class="tab-item" data-format="xlsx">Excel</div>
      <div class="tab-item" data-format="md">Markdown</div>
      <div class="tab-item" data-format="sql">SQL</div>
      <div class="tab-item" data-format="html">HTML</div>
      <div class="tab-item" data-format="xml">XML</div>
      <div class="tab-item" data-format="yaml">YAML</div>
      <div class="tab-item" data-format="ascii">ASCII</div>
      <div class="tab-item" data-format="latex">LaTeX</div>
    </div>
    <div class="generator-workspace">
       <div class="config-panel">
          <div id="table-config-list" style="flex: 1; overflow-y: auto; padding: 20px 16px;">
             <!-- 各格式特定的配置项将由 JS 动态注入于此 -->
             <div id="table-config-container">
                <div class="empty-state">选择格式以查看配置</div>
             </div>
          </div>
       </div>
       <div class="result-area" style="padding: 0;">
          <textarea id="table-input" class="f-textarea" placeholder="转换结果将在此实时显示..." style="height: 100%; min-height: 480px;"></textarea>
       </div>
    </div>
  </div>
</div>
