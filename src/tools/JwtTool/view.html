<div class="actions-bar">
    <button class="btn btn-primary" id="btn-parse-jwt">解析</button>
    <button class="btn" id="btn-clear-jwt">清空</button>
    <button class="btn btn-secondary btn-sm" id="btn-copy-header">复制 Header</button>
    <button class="btn btn-secondary btn-sm" id="btn-copy-payload">复制 Payload</button>
</div>

<!-- 输入区 -->
<div class="tool-card" style="margin-bottom: 20px;">
    <div class="card-header-fused">
        <div class="header-title">JWT Token</div>
    </div>
    <div class="card-body-fused" style="padding: 16px;">
        <textarea id="jwt-input" class="f-textarea" placeholder="在此粘贴 JWT token... (格式: header.payload.signature)" spellcheck="false" style="min-height: 140px; max-height: 240px;"></textarea>
        <div id="jwt-error" class="jwt-error" style="display: none;"></div>
    </div>
</div>

<!-- 解析结果区:三张卡片 -->
<div class="jwt-result-grid">
    <!-- Header -->
    <div class="tool-card">
        <div class="card-header-fused">
            <div class="header-title">Header <span id="jwt-alg-badge" class="jwt-badge" style="display:none;"></span></div>
        </div>
        <div class="card-body-fused jwt-card-body">
            <pre id="jwt-header" class="jwt-pre empty-state">等待解析...</pre>
        </div>
    </div>

    <!-- Payload -->
    <div class="tool-card">
        <div class="card-header-fused">
            <div class="header-title">Payload <span id="jwt-exp-badge" class="jwt-badge" style="display:none;"></span></div>
        </div>
        <div class="card-body-fused jwt-card-body">
            <pre id="jwt-payload" class="jwt-pre empty-state">等待解析...</pre>
            <div id="jwt-time-info" class="jwt-time-info"></div>
        </div>
    </div>

    <!-- Signature -->
    <div class="tool-card">
        <div class="card-header-fused">
            <div class="header-title">Signature</div>
        </div>
        <div class="card-body-fused jwt-card-body">
            <pre id="jwt-signature" class="jwt-pre empty-state">等待解析...</pre>
        </div>
    </div>
</div>

<!-- 样式已迁移至同目录 style.css（随主题皮肤自动加载） -->
