<!-- 顶部 actions-bar: 常用模板 + 清空 + 复制 + 次数 -->
<div class="actions-bar" style="flex-wrap: wrap; gap: 8px;">
    <span class="label" style="margin: 0;">常用模板</span>
    <select id="cron-preset" class="f-input-modern" style="width: auto; min-width: 180px; height: 30px;">
        <option value="">— 选择快速模板 —</option>
        <option value="* * * * *">每分钟</option>
        <option value="*/5 * * * *">每 5 分钟</option>
        <option value="*/15 * * * *">每 15 分钟</option>
        <option value="0 * * * *">每小时整点</option>
        <option value="30 * * * *">每小时 30 分</option>
        <option value="0 0 * * *">每天 00:00</option>
        <option value="0 9 * * *">每天 09:00</option>
        <option value="0 9 * * 1-5">工作日 09:00（一至五）</option>
        <option value="0 0 * * 0">每周日 00:00</option>
        <option value="0 0 1 * *">每月 1 号 00:00</option>
        <option value="0 0 1 1 *">每年 1 月 1 日 00:00</option>
        <option value="0 */2 * * *">每 2 小时</option>
    </select>
    <button class="btn btn-primary btn-sm" id="btn-parse-cron">解析</button>
    <button class="btn btn-secondary btn-sm" id="btn-clear-cron">清空</button>
    <button class="btn btn-sm" id="btn-copy-cron">复制</button>
    <span class="label" style="margin: 0 0 0 auto;">显示</span>
    <select id="cron-count" class="f-input-modern" style="width: auto; height: 28px;">
        <option value="10">10 次</option>
        <option value="20" selected>20 次</option>
        <option value="50">50 次</option>
        <option value="100">100 次</option>
    </select>
</div>

<!-- 表达式 + 字段提示 -->
<div class="tool-card">
    <div class="card-header-fused">
        <div class="header-title">Cron 表达式 (5 字段)</div>
        <span id="cron-status-badge" class="status-badge"></span>
    </div>
    <div class="card-body-fused">
        <div style="display: flex; gap: 10px; align-items: center;">
            <input type="text" id="cron-input" class="f-input-modern"
                   placeholder="例如: 0 9 * * 1-5"
                   spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"
                   style="font-family: var(--font-mono); font-size: 0.95rem; height: 38px; padding: 0 12px;">
        </div>
        <!-- 字段提示 (紧凑 inline 条形) -->
        <div class="cron-field-hint">
            <div class="cron-field-cell"><span class="cron-field-name">分</span><span class="cron-field-meta">0-59 · *, -, /</span></div>
            <div class="cron-field-cell"><span class="cron-field-name">时</span><span class="cron-field-meta">0-23 · *, -, /</span></div>
            <div class="cron-field-cell"><span class="cron-field-name">日</span><span class="cron-field-meta">1-31 · *, -, /, ?</span></div>
            <div class="cron-field-cell"><span class="cron-field-name">月</span><span class="cron-field-meta">1-12 · *, -, /</span></div>
            <div class="cron-field-cell"><span class="cron-field-name">周</span><span class="cron-field-meta">0-7 · *, -, /</span></div>
        </div>
        <div id="cron-error" class="cron-error" style="display: none;"></div>
    </div>
</div>

<!-- 中文解释 -->
<div class="tool-card">
    <div class="card-header-fused"><div class="header-title">解释说明</div></div>
    <div class="card-body-fused">
        <div id="cron-desc" class="cron-desc-box">
            <span style="color: var(--text-dim);">输入表达式后显示中文解释</span>
        </div>
    </div>
</div>

<!-- 未来 N 次执行时间 -->
<div class="tool-card">
    <div class="card-header-fused"><div class="header-title">未来执行时间</div></div>
    <div class="card-body-fused">
        <div id="cron-next-list" class="cron-next-list">
            <div class="empty-state" style="min-height: 90px;">输入表达式后显示未来 N 次执行时间</div>
        </div>
    </div>
</div>

<style>

    }
