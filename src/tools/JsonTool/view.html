<!-- 顶部状态栏 -->
<div class="json-status-bar" id="json-status-bar">
  <div class="status-left">
    <span id="json-validate-badge" class="status-badge"></span>
    <span id="json-info-text" class="status-info">请粘贴 JSON 数据</span>
  </div>
  <div class="status-right">
    <span id="json-size-info" class="status-meta"></span>
  </div>
</div>

<!-- 代码编辑器主体 -->
<div class="json-code-editor" id="json-code-editor" style="position: relative; width: 100%; height: 100%;">
  <textarea id="json-input"
    placeholder="请在这里粘贴 JSON 字符串..."
    spellcheck="false"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    style="display:none;"></textarea>
</div>

<!-- 底部操作工具栏 -->
<div class="json-action-bar">
  <button class="btn btn-primary" id="btn-format">格式化校验</button>
  <button class="btn" id="btn-compress">压缩</button>
  <button class="btn" id="btn-escape">转义</button>
  <button class="btn" id="btn-unescape">去除转义</button>
  <button class="btn" id="btn-unicode-cn">Unicode转中文</button>
  <button class="btn" id="btn-cn-unicode">中文转Unicode</button>
  <button class="btn" id="btn-clear-json">清空</button>
  <button class="btn" id="btn-copy-json">复制</button>
</div>
