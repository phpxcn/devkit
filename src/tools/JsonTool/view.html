<div class="actions-bar">
    <button class="btn btn-primary" id="btn-format">格式化</button>
    <button class="btn" id="btn-compress">压缩</button>
    <button class="btn" id="btn-clear-json">清空</button>
    <button class="btn" id="btn-copy-json">复制结果</button>
  </div>

  <div class="tool-panel">
    <div class="editor-container">
      <label class="label">JSON 输入 (实时高亮展示)</label>
      <div class="textarea-wrapper" style="flex-grow: 1;">
        <div id="json-input-h" class="highlight-layer"></div>
        <textarea id="json-input" placeholder="请在这里粘贴 JSON 字符串..."></textarea>
      </div>
    </div>
    
    <div class="editor-container" style="display: flex; flex-direction: column;">
      <label class="label">JSON 结构编辑器 (同框富文本视图)</label>
      <div id="unified-json-editor" class="tree-view" style="flex-grow: 1; background-color: #0b0c14; border-radius: 8px; border: 1px solid var(--border-color); overflow-y: auto; padding: 20px;">
         <!-- 这里将渲染带折叠和编辑功能的代码树 -->
         <div style="color: #64748b; padding: 20px;">等待数据录入...</div>
      </div>
    </div>
</div>
