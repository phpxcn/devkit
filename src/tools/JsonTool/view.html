<!-- 顶部状态栏 -->
<div class="json-status-bar" id="json-status-bar">
  <div class="status-left">
    <span id="json-validate-badge" class="status-badge"></span>
    <span id="json-info-text" class="status-info">请粘贴 JSON 数据</span>
  </div>
  <div class="json-search-container" id="json-search-container">
    <div class="search-main">
      <div class="search-row">
        <div class="search-input-wrapper">
          <input type="text" id="json-search-input" placeholder="查找..." spellcheck="false">
          <div class="search-options">
            <button class="opt-btn" id="btn-opt-case" title="区分大小写">Ab</button>
            <button class="opt-btn" id="btn-opt-word" title="全字匹配"><u>ab</u></button>
            <button class="opt-btn" id="btn-opt-regex" title="使用正则表达式">.*</button>
          </div>
          <span id="search-count" class="search-count">0/0</span>
        </div>
        <div class="search-controls">
          <button class="search-btn" id="btn-find-prev" title="上一个 (Shift+Enter)">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
          </button>
          <button class="search-btn" id="btn-find-next" title="下一个 (Enter)">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M7.41 8.58L12 13.17l4.59-4.59L18 10l-6 6-6-6z"/></svg>
          </button>
          <button class="search-btn" id="btn-toggle-replace" title="展开替换">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
          </button>
        </div>
      </div>
      <div class="replace-row" id="replace-row" style="display: none;">
        <div class="search-input-wrapper">
          <input type="text" id="json-replace-input" placeholder="替换为..." spellcheck="false">
        </div>
        <div class="search-controls">
          <button class="search-btn" id="btn-replace-one" title="替换">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12.5 8L11 9.5l3.5 3.5H4v2h10.5L11 18.5l1.5 1.5 6-6-6-6z"/></svg>
          </button>
          <button class="search-btn" id="btn-replace-all" title="全部替换">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M13 6v5H8V6h5m2-2H6v9h9V4m5 11h-9v9h9v-9z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="status-right">
    <span id="json-size-info" class="status-meta"></span>
  </div>
</div>

<!-- 代码编辑器主体 -->
<div class="json-code-editor" id="json-code-editor" style="position: relative; width: 100%; height: 100%;">
  <textarea id="json-input"
    placeholder="请在这里粘贴 JSON 字符串..."
    spellcheck="false"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    style="display:none;"></textarea>
</div>

<!-- 底部操作工具栏 -->
<div class="json-action-bar">
  <button class="btn btn-primary" id="btn-format">格式化校验</button>
  <button class="btn" id="btn-compress">压缩</button>
  <button class="btn" id="btn-escape">转义</button>
  <button class="btn" id="btn-unescape">去除转义</button>
  <button class="btn" id="btn-unicode-cn">Unicode转中文</button>
  <button class="btn" id="btn-cn-unicode">中文转Unicode</button>
  <button class="btn" id="btn-clear-json">清空</button>
  <button class="btn" id="btn-copy-json">复制</button>
</div>
