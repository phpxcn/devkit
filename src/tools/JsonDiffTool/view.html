<div class="actions-bar">
    <button class="btn btn-primary" id="btn-compare-json">开始对比</button>
    <button class="btn" id="btn-swap-json">左右互换</button>
    <button class="btn" id="btn-clear-diff">全部清空</button>
</div>

<!-- 差异过滤 toolbar -->
<div class="diff-filter-bar">
    <div class="diff-stats">
        <span class="stat-item stat-added" id="stat-added">+0</span>
        <span class="stat-item stat-removed" id="stat-removed">-0</span>
        <span class="stat-item stat-changed" id="stat-changed">~0</span>
    </div>
    <div class="diff-filter-controls">
        <div class="filter-btns" role="group" aria-label="差异类型筛选">
            <button class="opt-btn active" data-filter="all">全部</button>
            <button class="opt-btn" data-filter="added">新增</button>
            <button class="opt-btn" data-filter="removed">删除</button>
            <button class="opt-btn" data-filter="changed">变更</button>
        </div>
        <input type="text" id="diff-path-filter" class="path-filter-input" placeholder="按路径过滤 (如 user.name)..." spellcheck="false">
    </div>
</div>

<div class="tool-panel diff-panel" style="max-height: 350px; flex-shrink: 1; min-height: 240px;">
    <div class="editor-container">
        <label class="label">原始 JSON (Left)</label>
        <div class="textarea-wrapper" style="flex-grow: 1;">
            <textarea id="json-left" placeholder="输入原始 JSON..."></textarea>
        </div>
    </div>
    
    <div class="editor-container">
        <label class="label">对比 JSON (Right)</label>
        <div class="textarea-wrapper" style="flex-grow: 1;">
            <textarea id="json-right" placeholder="输入对比 JSON..."></textarea>
        </div>
    </div>
</div>

<div class="editor-container" style="margin-top: 20px; flex-grow: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
    <label class="label">对比结果分析</label>
    <div id="diff-results" class="tree-view" style="flex-grow: 1; overflow-y: auto; background-color: var(--input-bg); border-radius: 8px; border: 1px solid var(--border-color); padding: 15px;">
        <div style="color: var(--text-dim); text-align: center; padding-top: 40px;">
            请在上方输入两个 JSON 对象并点击“开始对比”
        </div>
    </div>
</div>

<style>
    .diff-panel {
        grid-template-columns: 1fr 1fr !important;
    }
    .diff-item {
        padding: 4px 8px;
        border-radius: 4px;
        margin-bottom: 2px;
        font-family: var(--font-mono);
        font-size: 0.85rem;
    }
    .diff-added { background-color: rgba(34, 197, 94, 0.15); border-left: 3px solid #22c55e; }
    .diff-removed { background-color: rgba(239, 68, 68, 0.15); border-left: 3px solid #ef4444; }
    .diff-changed { background-color: rgba(234, 179, 8, 0.1); border-left: 3px solid #eab308; }
    .diff-path { color: var(--text-dim); margin-right: 8px; font-weight: 600; }
    .diff-val-old { color: #ef4444; text-decoration: line-through; margin-right: 10px; }
    .diff-val-new { color: #22c55e; font-weight: 600; }

    /* ── 差异过滤 toolbar ── */
    .diff-filter-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
        padding: 8px 10px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        flex-wrap: wrap;
    }
    .diff-stats { display: flex; gap: 14px; font-family: var(--font-mono); font-size: 0.85rem; }
    .stat-item { font-weight: 600; }
    .stat-added { color: #22c55e; }
    .stat-removed { color: #ef4444; }
    .stat-changed { color: #eab308; }
    .diff-filter-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filter-btns { display: flex; gap: 2px; border: 1px solid var(--border-color); border-radius: 4px; overflow: hidden; }
    .opt-btn { background: transparent; border: none; color: var(--text-dim); font-size: 0.78rem; cursor: pointer; padding: 4px 10px; line-height: 1; transition: var(--transition); }
    .opt-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.05); }
    .opt-btn.active { color: #fff; background: var(--accent-color); font-weight: bold; }
    .path-filter-input { background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 4px; height: 28px; padding: 0 8px; color: var(--text-primary); font-size: 0.8rem; min-width: 220px; outline: none; }
    .path-filter-input:focus { border-color: var(--accent-color); }

    .diff-empty { color: var(--text-dim); text-align: center; padding: 16px; font-size: 0.85rem; }
</style>
