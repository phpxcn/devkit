<!-- 顶部操作栏: 导入 / 清空 / 页面选项 / 转换 -->
<div class="actions-bar" style="flex-wrap: wrap; gap: 8px;">
    <button class="btn btn-secondary btn-sm" id="md-pdf-import">📄 导入 .md</button>
    <button class="btn btn-secondary btn-sm" id="md-pdf-clear">清空</button>
    <span class="label" style="margin: 0 0 0 auto;">页面</span>
    <select id="md-pdf-pagesize" class="f-input-modern" style="width: auto; min-width: 90px; height: 30px;">
        <option value="A4">A4</option>
        <option value="A5">A5</option>
        <option value="Letter">Letter</option>
        <option value="Legal">Legal</option>
    </select>
    <span class="label" style="margin: 0;">主题</span>
    <select id="md-pdf-theme" class="f-input-modern" style="width: auto; min-width: 100px; height: 30px;">
        <option value="light">浅色 (白底)</option>
        <option value="sepia">羊皮纸</option>
        <option value="dark">深色</option>
    </select>
    <button class="btn btn-primary btn-sm" id="md-pdf-convert" style="margin-left: 8px;">⚡ 转 PDF</button>
</div>

<!-- 主体: 左右分栏 (输入 + 预览) -->
<div class="tool-card" style="padding: 0; flex: 1; display: flex; min-height: 0; overflow: hidden;">
    <!-- 左: Markdown 输入 -->
    <div class="md-pdf-pane" style="flex: 1; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border-color);">
        <div class="card-header-fused" style="display:flex; justify-content:space-between; align-items:center;">
            <span class="header-title">Markdown 源码</span>
            <span id="md-pdf-stats" style="font-size:0.7rem; color:var(--text-dim); font-family:var(--font-mono);">0 行 / 0 字符</span>
        </div>
        <textarea id="md-pdf-input" class="md-pdf-input" spellcheck="false"
            placeholder="# 在此粘贴 Markdown&#10;&#10;支持标题、列表、**加粗**、*斜体*、`代码`、表格、引用、链接、图片等...&#10;点击右上角「⚡ 转 PDF」生成 PDF 文件。"
            style="flex:1; width:100%; resize:none; border:none; outline:none; padding:16px 18px; background:var(--input-bg); color:var(--text-primary); font-family:var(--font-mono); font-size:0.9rem; line-height:1.6;"></textarea>
    </div>

    <!-- 右: 实时预览 -->
    <div class="md-pdf-pane" style="flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden;">
        <div class="card-header-fused" style="display:flex; justify-content:space-between; align-items:center;">
            <span class="header-title">实时预览</span>
            <span style="font-size:0.7rem; color:var(--text-dim);">所见即所得</span>
        </div>
        <div id="md-pdf-preview" class="md-pdf-preview markdown-body" style="flex:1; overflow:auto; padding:24px 28px;">
            <div class="empty-state" style="color:var(--text-dim);">输入 Markdown 后将在此显示预览</div>
        </div>
    </div>
</div>

<div id="md-pdf-status" style="margin-top:10px; font-size:0.78rem; color:var(--text-dim); text-align:center;">就绪</div>
