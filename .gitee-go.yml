name: DevKit-Build-Pipeline

# 触发条件：发送到主分支的 push 请求
on:
  push:
    branches:
      - main
      - master  # 兼容某些仓库的主分支名是 master

jobs:
  build_job:
    name: Build DevKit Apps
    runs-on: gitee-go-linux-agent 
    
    steps:
      - name: Checkout Repository
        uses: gitee-go/checkout@v1
      
      - name: Setup Node.js
        uses: gitee-go/node-setup@v1
        with:
          node-version: 18

      - name: Path Debug & Auto Sync
        id: path_sync
        # 有时仓库被拉到了子文件夹，这里我们找出 package.json 并在对应位置安装
        run: |
          echo "==== 开始定位 package.json ===="
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "错误: 找不到 package.json 文件！当前目录预览:"
            ls -R
            exit 1
          fi
          
          # 获取 package.json 所在的目录
          BASE_DIR=$(dirname "$PKG_PATH")
          echo "发现项目根目录: $BASE_DIR"
          
          # 动态进入目录并执行安装
          cd "$BASE_DIR"
          npm install
          
          # 执行打包 (针对 Windows 和 Linux)
          echo "==== 开始打包流程 ===="
          npm run build-win
          npm run build-linux
          
          # 将打包后的文件移动到顶层目录的 release 文件夹，方便后续存档
          mkdir -p $GITEE_WORKSPACE/release-dist
          cp -r release/*.exe $GITEE_WORKSPACE/release-dist/ || true
          cp -r release/*.AppImage $GITEE_WORKSPACE/release-dist/ || true
          cp -r release/*.deb $GITEE_WORKSPACE/release-dist/ || true

      - name: Archiving Artifacts
        uses: gitee-go/artifact-upload@v1
        with:
          name: DevKit-Build-Artifacts
          path: release-dist/*
