name: Release Build
# v3: 拆分建草稿步骤，避免三个平台 job 并发操作同一 Release 的竞态

on:
  push:
    tags:
      - 'v*'

jobs:
  # 第一步（单独 job）：为本次 tag 创建草稿 Release，只执行一次
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            builder_args: --mac --arm64 --x64
          - os: windows-latest
            builder_args: --win
          - os: ubuntu-latest
            builder_args: --linux

    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 仅 Linux 需要：canvas 原生模块编译所需的图形库
      - name: Install Linux native build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            libpixman-1-dev \
            pkg-config

      - name: Install dependencies
        run: npm ci

      - name: Build & publish
        run: npx electron-builder ${{ matrix.builder_args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}