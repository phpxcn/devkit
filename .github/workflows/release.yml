name: Release Build
# v3: 拆分建草稿步骤，避免三个平台 job 并发操作同一 Release 的竞态

# 打 tag 即触发：git tag v1.2.2 && git push origin v1.2.2
on:
  push:
    tags:
      - 'v*'

jobs:
  # 第一步（单独 job）：为本次 tag 创建草稿 Release，只执行一次
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true

  build:
    needs: draft   # 确保草稿建好后三个平台才开始构建，消除并发竞态
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple 芯片 runner，交叉打出 arm64 + x64
            builder_args: --mac --arm64 --x64
          - os: windows-latest
            builder_args: --win
          - os: ubuntu-latest
            builder_args: --linux

    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write   # electron-builder 需要创建/上传 Release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder 会把安装包上传进 draft job 建好的草稿并发布
      - name: Build & publish
        run: npx electron-builder ${{ matrix.builder_args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
