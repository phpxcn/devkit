name: Release Build
# v5: 三平台构建并发布到 GitHub Releases（应用内更新走 GitHub API 检查 + 浏览器手动下载，
# 不再同步附件到 Gitee；仓库代码由本地 push 双远端同步 Gitee）

on:
  push:
    tags:
      - 'v*'

jobs:
  # 第一步（单独 job）：为本次 tag 创建草稿 Release，只执行一次
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            builder_args: --mac --arm64 --x64
          - os: windows-latest
            builder_args: --win
          - os: ubuntu-latest
            builder_args: --linux

    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux native build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            libpixman-1-dev \
            pkg-config

      - name: Install dependencies
        run: npm ci

      - name: Build & publish
        run: npx electron-builder ${{ matrix.builder_args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 最后一步（单独 job）：三个平台都上传完成后，把 Draft 发布并设为最新
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          make_latest: true
          generate_release_notes: true