appId: com.devkit.toolbox
productName: 工坊 (DevKit)
directories:
  output: dist
  buildResources: build
files:
  - "**/*"
  - "!dist/**/*"
  - "!build/**/*"

mac:
  category: public.app-category.developer-tools
  target: 
    - dmg
    - zip
  icon: assets/icons/icon.icns

win:
  target:
    - nsis
    - portable
  icon: assets/icons/icon.png

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: assets/icons/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: 工坊 (DevKit)
